name: retail-dev
services:
  db:
    image: postgres:15-alpine
    restart: always
    container_name: postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retail_test_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./fresh-dump.sql:/docker-entrypoint-initdb.d/fresh-dump.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: always
    container_name: redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  postgres_test_data:
  redis_test_data:

networks:
  app-network:
    driver: bridge